services:
  - type: web
    name: poisk-zakaza
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PYTHONIOENCODING
        value: utf-8
      - key: DATABASE_URL
        fromDatabase:
          name: poisk-zakaza-db
          property: connectionString
      # Пароль для входа (раскомментируйте и задайте свой):
      # - key: APP_USER
      #   value: admin
      # - key: APP_PASSWORD
      #   value: your-secret
      # Раскомментируйте и укажите прокси, если t.me блокируется:
      # - key: TG_PROXY
      #   value: socks5h://127.0.0.1:1080

databases:
  - name: poisk-zakaza-db
    plan: free
    databaseName: orders
    user: orders
